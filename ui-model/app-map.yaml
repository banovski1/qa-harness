# Login + crawl spec for the deterministic UI mapper (ui-mapper/mapper.mjs).
# Point this at ANY web app: give the login flow as parameters (URL, credentials,
# and the locators for username / password / submit), and the mapper logs in and
# builds ui-model/application-map/*.yaml + component-inventory.md from the a11y tree.
#
# Locator shape { strategy, args, name } is identical to the emitted map schema.
# Strategies: getByRole | getByLabel | getByPlaceholder | getByText | getByAltText
#             | getByTitle | getByTestId | css
app: orangehrm
baseUrl: https://opensource-demo.orangehrmlive.com
credentials:
  username: Admin
  password: admin123
login:
  loginUrl: /web/index.php/auth/login
  usernameLocator: { strategy: getByRole, args: ["textbox"], name: "Username" }
  passwordLocator: { strategy: getByRole, args: ["textbox"], name: "Password" }
  submitLocator:   { strategy: getByRole, args: ["button"],  name: "Login" }
  successSignal:   { strategy: getByRole, args: ["heading"], name: "Dashboard" }
seeds:
  - /web/index.php/admin/viewSystemUsers
crawl:
  captureStates: true
  maxStatesPerPage: 6
  discoverLinks: true   # BFS-follow same-origin nav links found on each mapped page
  maxPages: 40           # safety cap on how many pages a single run will map
