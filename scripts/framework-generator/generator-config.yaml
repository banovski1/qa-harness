# Framework generator input — the only file you need to edit.
#
#   node scripts/framework-generator/generate.mjs [path/to/this-file.yaml] [--dry-run]
#
# Run from the repo root so analysisDir and outputDir resolve correctly. The generator
# reads the reports the repo analyzer writes from a local clone of the app under test and
# emits a Playwright component-object-model framework in the language named below.

language: typescript    # typescript | javascript | java | python | csharp
projectName: orangehrm-e2e
outputDir: ./generated-framework
baseUrl: https://opensource-demo.orangehrmlive.com
analysisDir: analysis

# Optional. Static analysis describes screens, never flows, so the login sequence is not
# something it can produce — point this at the app config to get a working login helper
# instead of a stub. Credentials are NOT read from it — they come from
# APP_USERNAME / APP_PASSWORD in the generated project's .env.
loginConfig: scripts/app-config.yaml

pages:
  folderSegment: auto         # URL segment used as the folder group; `auto` strips the
                              # prefix every mapped URL shares, or set a 1-based number
  dropParamSegments: true     # drop trailing /empNumber/7 style pairs from page identity
  mergeDuplicates: true       # collapse *Module redirect pages onto their list-page twin

elements:
  sharedChromeThreshold: 0.8  # retained for the api layer's own grouping; navigation is declared below
  includeUnstable: true       # emit rung-8 locators, annotated with the reason they are brittle

# The application's shared navigation, declared rather than derived.
#
# This is the one part of a rendered page static analysis cannot reach: OrangeHRM's sidebar
# is rendered by the external @ohrm/oxd package and filled from a server menu payload, so it
# appears in no template in the app's own source. Each entry is the same
# `{ name, component, locator }` shape an extracted element has, and every entry is lifted
# into a single NavigationBar component instead of being repeated on every page object.
#
# Leave the list empty for an app whose navigation is in its own markup — the extractor will
# find it, and no NavigationBar is emitted.
navigation:
  - name: adminMenuLink
    component: link
    locator: {strategy: getByRole, args: ["link"], name: "Admin"}
  - name: pimMenuLink
    component: link
    locator: {strategy: getByRole, args: ["link"], name: "PIM"}
  - name: leaveMenuLink
    component: link
    locator: {strategy: getByRole, args: ["link"], name: "Leave"}
  - name: timeMenuLink
    component: link
    locator: {strategy: getByRole, args: ["link"], name: "Time"}
  - name: recruitmentMenuLink
    component: link
    locator: {strategy: getByRole, args: ["link"], name: "Recruitment"}
  - name: myInfoMenuLink
    component: link
    locator: {strategy: getByRole, args: ["link"], name: "My Info"}
  - name: performanceMenuLink
    component: link
    locator: {strategy: getByRole, args: ["link"], name: "Performance"}
  - name: dashboardMenuLink
    component: link
    locator: {strategy: getByRole, args: ["link"], name: "Dashboard"}
  - name: directoryMenuLink
    component: link
    locator: {strategy: getByRole, args: ["link"], name: "Directory"}
  - name: maintenanceMenuLink
    component: link
    locator: {strategy: getByRole, args: ["link"], name: "Maintenance"}
  - name: claimMenuLink
    component: link
    locator: {strategy: getByRole, args: ["link"], name: "Claim"}
  - name: buzzMenuLink
    component: link
    locator: {strategy: getByRole, args: ["link"], name: "Buzz"}
  - name: searchMenuInput
    component: input
    locator: {strategy: css, args: [".oxd-main-menu-search input"]}
  - name: collapseMenuButton
    component: button
    locator: {strategy: css, args: ["button.oxd-main-menu-button"]}
  - name: currentUserHeading
    component: text
    locator: {strategy: css, args: [".oxd-userdropdown-name"]}

waits:
  # Selector for the app's loading indicator, used by waitForSpinnerToClear().
  # The default is role-based and works on any accessible app; add your app's own
  # class if it renders a spinner with no busy state, e.g. '.my-spinner, [role="progressbar"]'.
  spinnerSelector: '[role="progressbar"], [aria-busy="true"]'

tests:
  generateSmokeSpecs: true    # one navigate + assert spec per generated page object

# Label-parameterised locator templates: the app's answer to "how do I find the input
# belonging to this label". `{label}` is substituted with the element's label, and a page
# object then reads `InputComponent.byLabel(this.page, 'City')` instead of carrying the
# selector. This block and the `navigation:` list above are the only two places an
# app-specific selector appears — retargeting means replacing them.
#
# These ids are rung 4 on the locator ladder: a template expands to CSS but is anchored to
# a label, so it breaks only when the label does. An element is emitted through a factory
# only when the template reproduces its locator exactly; anything else keeps its own, so a
# one-off never gets bent to fit. Remove a line to turn its factory off; remove the block
# for an app whose labels are properly associated (`getByLabel` is rung 3 and needs none).
locatorTemplates:
  labelledInput:    '.oxd-input-group:has(label:text-is("{label}")) input'
  labelledTextarea: '.oxd-input-group:has(label:text-is("{label}")) textarea'
  labelledSelect:   '.oxd-input-group:has(label:text-is("{label}")) .oxd-select-text'
  labelledRadio:    '.oxd-radio-wrapper:has(label:text-is("{label}")) input'
  topNavTab:        '.oxd-topbar-body-nav-tab > a:text-is("{label}")'
  tableByColumn:    '.oxd-table:has(.oxd-table-th:text-is("{label}"))'

# Where scripts/framework-generator/smart-api-map.mjs writes the normalized api-map
# (one YAML file per resource). Absent or empty directory -> no API layer is
# generated; nothing else changes.
apiMapDir: analysis/api-map

api:
  enabled: true
  include: {}                 # { tags: [Users, Claims] } or { operationIds: [...] } — empty means "all"
  exclude: {}                 # same shape, subtracted after include
  generateAssertionSpecs: true  # one status/schema check per api-mapped operation
  generateFactories: true       # scaffold src/data/factories/<resource>-factory.ts stubs
