# Manual fallback spec, in this repo's own request-spec vocabulary — used by
# scripts/smart-api-map.mjs when apiSpec.specUrl/specPath is absent or unreachable.
# Written by hand because OrangeHRM's demo does not publish an OpenAPI/Swagger doc.
#
# Shape: resources: [{ resource, operations: [{ operationId, method, path, pathParams,
# queryParams, requestBody: { schema }, responses: [{ status, schema }] }] }].
# schema is { kind: object, properties: [...] } | { kind: array, items } | { kind: primitive, type }.
#
# This is a starter example, not a complete mapping of OrangeHRM's internal API —
# extend it with the endpoints your tests actually need preconditions or assertions for.
resources:
  - resource: Users
    operations:
      - operationId: getUsers
        method: GET
        path: /api/v2/admin/users
        queryParams:
          - { name: limit, type: number, required: false }
        responses:
          - status: 200
            schema:
              kind: object
              properties:
                - { name: data, type: unknown }
                - { name: meta, type: unknown }
      - operationId: createUser
        method: POST
        path: /api/v2/admin/users
        requestBody:
          schema:
            kind: object
            properties:
              - { name: username, type: string, required: true }
              - { name: password, type: string, required: true }
              - { name: userRoleId, type: number, required: true }
        responses:
          - status: 200
            schema:
              kind: object
              properties:
                - { name: id, type: number, required: true }
                - { name: username, type: string, required: true }
      - operationId: getUser
        method: GET
        path: /api/v2/admin/users/{id}
        pathParams:
          - { name: id, type: number }
        responses:
          - status: 200
            schema: { kind: object, properties: [{ name: id, type: number, required: true }] }
          - status: 404
