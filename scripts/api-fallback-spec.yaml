# Manual fallback spec, in this repo's own request-spec vocabulary — used by
# scripts/framework-generator/smart-api-map.mjs when apiSpec.specUrl/specPath is absent
# or unreachable. Write it by hand when the app publishes no OpenAPI/Swagger document.
#
# Shape: resources: [{ resource, operations: [{ operationId, method, path, pathParams,
# queryParams, requestBody: { schema }, responses: [{ status, schema }] }] }].
# schema is { kind: object, properties: [...] } | { kind: array, items } | { kind: primitive, type }.
#
# This is not meant to be a complete mapping of the app's API — list the endpoints your tests
# actually need for preconditions or assertions, and nothing else.
#
# An example resource:
#
#   resources:
#     - resource: Users
#       operations:
#         - operationId: createUser
#           method: POST
#           path: /api/v2/admin/users
#           requestBody:
#             schema:
#               kind: object
#               properties:
#                 - { name: username, type: string, required: true }
#           responses:
#             - status: 200
#               schema: { kind: object, properties: [{ name: id, type: integer }] }
resources: []
