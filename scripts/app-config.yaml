# The target application: where it is, and how to log in. Point this at ANY web app.
#
# This branch carries no target app — fill `baseUrl:` and the `login:` block in before running
# anything that reads them.
#
# Read by:
#   - the `playwright-codegen` skill, which records a human-driven flow into codegen-recordings/
#   - scripts/framework-generator (via `loginConfig:` in generator-config.yaml), which reads ONLY the
#     `login:` block to emit a working login helper.
#
# Credentials are deliberately absent. They belong in APP_USERNAME / APP_PASSWORD in the generated
# project's .env, which is gitignored; nothing here reads them, and a password committed to a base
# branch would be inherited by every branch taken from it.
#
# Locator shape { strategy, args, name } is identical to the schema the analyzer emits.
# Strategies: getByRole | getByLabel | getByPlaceholder | getByText | getByAltText
#             | getByTitle | getByTestId | css   (see framework-generator/locator-spec.mjs)
# Ranking:    scripts/framework-generator/locator-ladder.mjs — prefer the highest rung the app allows.
app: ""
baseUrl: ""
login:
  # e.g. /login, or /web/index.php/auth/login for an app mounted under a prefix
  loginUrl: ""
  usernameLocator: {}
  passwordLocator: {}
  submitLocator:   {}
  # An element that exists only once login has succeeded — how the helper knows it worked.
  successSignal:   {}
  #
  # A worked example, from an app whose login form is properly labelled:
  #
  #   loginUrl: /web/index.php/auth/login
  #   usernameLocator: { strategy: getByRole, args: ["textbox"], name: "Username" }
  #   passwordLocator: { strategy: getByRole, args: ["textbox"], name: "Password" }
  #   submitLocator:   { strategy: getByRole, args: ["button"],  name: "Login" }
  #   successSignal:   { strategy: getByRole, args: ["heading"], name: "Dashboard" }

# Path segments matching this collapse to {id} in a route's URL, so one representative page is
# emitted per entity view rather than one per row.
idSegmentPattern: "^\\d+$"

# Controls a browser-driven step must never click. Kept app-agnostic: these are the words that
# name a destructive or session-ending action in most applications.
denyClickNames:
  - delete
  - save
  - submit
  - remove
  - logout
  - sign out
  - trash
  - terminate
  - reset

# Where the app's API spec lives, read by scripts/framework-generator/smart-api-map.mjs (a
# deterministic script, not a browser skill — parsing a self-describing JSON doc needs no AI
# judgment). Tries specUrl/specPath first; on failure, falls back to fallbackSpec, which is
# written in this repo's own request-spec vocabulary.
#
# Set specUrl OR specPath if the app publishes OpenAPI/Swagger. If it does not, describe the
# endpoints your tests need in the fallback file instead.
apiSpec:
  # specUrl: https://example.test/openapi.json
  # specPath: ../my-app/openapi.yaml
  fallbackSpec: scripts/api-fallback-spec.yaml
