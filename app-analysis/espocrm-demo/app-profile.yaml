# The only file in this analysis that names anything app-specific.
# Retargeting the explorer at another app is a new profile, never a code change.
name: EspoCRM demo (EU)
baseUrl: https://demo.eu.espocrm.com/
session: espo

auth:
  loginUrl: https://demo.eu.espocrm.com/?l=en_GB
  # The public demo gates on a user picker rather than a password. An app with a
  # real login puts its password step here as `value: env:APP_PASSWORD`, so the
  # credential is read from the environment and never stored in this file.
  steps:
    - { action: select, selector: "#field-userName", value: admin }
    - { action: click, selector: "#btn-login" }
  # A marker must be a visibly rendered element: Espo's #navbar container has zero
  # height, so a navigation link proves the app booted where the container cannot.
  readyWhen: "a[href='#Contact']"

# Seeds cover the entity families the navigation exposes; the crawl discovers
# detail and related screens from the links each one renders.
seedRoutes:
  - "#Account"
  - "#Contact"
  - "#Contact/create"
  - "#Lead"
  - "#Lead/create"
  - "#Opportunity"
  - "#Opportunity/create"
  - "#Email"
  - "#Calendar"
  - "#Meeting"
  - "#Meeting/create"
  - "#Call"
  - "#Task"
  - "#Task/create"
  - "#Case"
  - "#Case/create"
  - "#KnowledgeBaseArticle"
  - "#Document"
  - "#Product"
  - "#Quote"
  - "#SalesOrder"
  - "#Invoice"
  - "#Campaign"
  - "#TargetList"
  - "#Report"
  - "#Project"
  - "#ProjectTask"
  - "#User"
  - "#Team"
  - "#Stream"
  - "#Preferences"

# The crawl is read-only, so these are the screens that cost budget without
# repaying it: an admin tree of several hundred settings pages, and anything
# that would end the session.
exclude:
  - "#Admin/"
  - "logout"
  - "\\?entryPoint="
  - "#Import"

budget:
  maxScreens: 60
  maxDepth: 2

settings:
  testIdAttribute: data-testid
  # Espo renders its list and detail views into #main after the route resolves,
  # so settling alone can catch a screen whose content has not arrived yet.
  contentSelector: "#main"
  batchSize: 6
  settleTimeout: 8000
  navTimeout: 30000
