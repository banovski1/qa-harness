actions:
  - do: Complete and submit this form
    kind: form
    fields:
      - { label: Name, locator: '.oxd-input-group:has(label:text-is("Name")) input', type: text }
      - { label: City, locator: '.oxd-input-group:has(label:text-is("City")) input', type: text }
      - { label: State/Province, locator: '.oxd-input-group:has(label:text-is("State/Province")) input', type: text }
      - { label: Zip/Postal Code, locator: '.oxd-input-group:has(label:text-is("Zip/Postal Code")) input', type: text }
      - { label: Country, locator: '.oxd-input-group:has(label:text-is("Country")) .oxd-select-text', type: dropdown }
      - { label: Phone, locator: '.oxd-input-group:has(label:text-is("Phone")) input', type: text }
      - { label: Fax, locator: '.oxd-input-group:has(label:text-is("Fax")) input', type: text }
      - { label: Address, locator: '.oxd-input-group:has(label:text-is("Address")) textarea', type: text }
      - { label: Notes, locator: '.oxd-input-group:has(label:text-is("Notes")) textarea', type: text }
    submit: 'getByRole("button", { name: "Save" })'
    effect: Submits the form. Required fields left empty raise "Required" under each field.
