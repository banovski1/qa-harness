actions:
  - do: Search this screen
    kind: form
    fields:
      - { label: Employee Name, locator: '.oxd-input-group:has(label:text-is("Employee Name")) input', type: text }
      - { label: Job Title, locator: '.oxd-input-group:has(label:text-is("Job Title")) .oxd-select-text', type: dropdown }
      - { label: Sub Unit, locator: '.oxd-input-group:has(label:text-is("Sub Unit")) .oxd-select-text', type: dropdown }
      - { label: Include, locator: '.oxd-input-group:has(label:text-is("Include")) .oxd-select-text', type: dropdown }
      - { label: Review Status, locator: '.oxd-input-group:has(label:text-is("Review Status")) .oxd-select-text', type: dropdown }
      - { label: From Date, locator: '.oxd-input-group:has(label:text-is("From Date")) input', type: text }
      - { label: To Date, locator: '.oxd-input-group:has(label:text-is("To Date")) input', type: text }
    submit: 'getByRole("button", { name: "Search" })'
    effect: Filters the records table in place. No navigation.
  - do: Clear the search filters
    kind: click
    target: 'getByRole("button", { name: "Reset" })'
    effect: Restores the unfiltered list and clears every filter field.
  - do: Open a record for editing
    kind: rowAction
    target: '.oxd-table-card:has-text("<record>") i.bi-pencil-fill'
    effect: Opens the edit form for that row.
  - do: Delete a record
    kind: destructive
    notExercised: true
    target: '.oxd-table-card:has-text("<record>") i.bi-trash'
    effect: Opens a confirmation dialog and permanently deletes the row. Never performed while mapping.
