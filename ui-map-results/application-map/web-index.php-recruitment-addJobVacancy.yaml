actions:
  - do: Complete and submit this form
    kind: form
    fields:
      - { label: Vacancy Name, locator: '.oxd-input-group:has(label:text-is("Vacancy Name")) input', type: text }
      - { label: Job Title, locator: '.oxd-input-group:has(label:text-is("Job Title")) .oxd-select-text', type: dropdown }
      - { label: Description, locator: '.oxd-input-group:has(label:text-is("Description")) textarea', type: text }
      - { label: Hiring Manager, locator: '.oxd-input-group:has(label:text-is("Hiring Manager")) input', type: text }
      - { label: Number of Positions, locator: '.oxd-input-group:has(label:text-is("Number of Positions")) input', type: text }
    submit: 'getByRole("button", { name: "Save" })'
    effect: Submits the form. Required fields left empty raise "Required" under each field.
