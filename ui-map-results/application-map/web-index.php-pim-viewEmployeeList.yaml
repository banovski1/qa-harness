  - name: resetButton
    component: button
    locator: { strategy: getByRole, args: ["button"], name: "Reset" }
    comment: "Reset (button)"
  - name: searchButton
    component: button
    locator: { strategy: getByRole, args: ["button"], name: "Search" }
    comment: "Search (button)"
  - name: addButton
    component: button
    locator: { strategy: css, args: [".orangehrm-header-container button:has-text(\"Add\")"] }
    comment: "Add (button)"
  - name: selectAllCheckbox
    component: checkbox
    locator: { strategy: getByRole, args: ["checkbox"], within: { strategy: getByRole, args: ["columnheader"] } }
    comment: "Select All (checkbox)"
  - name: employeeTable
    component: table
    locator: { strategy: getByRole, args: ["table"] }
    columns:
      - name: "Id"
      - name: "First (& Middle) Name"
      - name: "Last Name"
      - name: "Job Title"
      - name: "Employment Status"
      - name: "Sub Unit"
      - name: "Supervisor"
      - name: "Actions"
    rowCount: 0
    comment: "Employee (table)"
actions:
  - do: "Filter the employee list"
    kind: form
    fields:
      - "Employee Name (autocomplete; fill() does trigger the suggestion list)"
      - "Employee Id"
      - "Employment Status"
      - "Include (defaults to \"Current Employees Only\")"
      - "Supervisor Name (autocomplete)"
      - "Job Title"
      - "Sub Unit"
    submit: "searchButton"
    effect: "The table re-renders in place, no navigation. The \"(N) Records Found\" line above it updates — assert on that."
  - do: "Clear all filters"
    kind: toggle
    target: "resetButton"
    effect: "Empties every filter field and reloads the unfiltered list."
  - do: "Start a new employee record"
    kind: navigation
    target: "addButton"
    leadsTo: "/web/index.php/pim/addEmployee"
  - do: "Open an employee record"
    kind: navigation
    target: "getByRole(\"row\").filter({ hasText: \"<name>\" }).locator(\"button i.bi-pencil-fill\") — per-row, so not a mapped element"
    leadsTo: "/web/index.php/pim/viewPersonalDetails/empNumber/{id}"
    note: "The row itself is clickable and goes to the same place."
  - do: "Select rows for a bulk operation"
    kind: toggle
    target: "selectAllCheckbox"
    effect: "Reveals the \"Delete Selected\" button above the table."
  - do: "Delete an employee"
    kind: destructive
    target: "row → button i.bi-trash, or \"Delete Selected\" for the bulk form"
    effect: "Opens a confirm dialog."
    notExercised: true
