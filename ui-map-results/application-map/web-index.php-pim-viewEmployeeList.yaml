    comment: "Search (button)"
  - name: addButton
    component: button
    locator: { strategy: getByRole, args: ["button"], name: "Add" }
    comment: "Add (button)"
  - name: recordsFoundHeading
    component: text
    locator: { strategy: css, args: [".orangehrm-horizontal-padding .oxd-text--span"] }
    comment: "Records Found (text)"
  - name: selectAllCheckbox
    component: checkbox
    locator: { strategy: css, args: [".oxd-table-header .oxd-checkbox-input"] }
    comment: "Select all rows (checkbox)"
  - name: employeeTable
    component: table
    locator: { strategy: css, args: [".oxd-table:has(.oxd-table-th:text-is(\"Employment Status\"))"] }
    columns:
      - name: ""
      - name: "Id"
      - name: "First (& Middle) Name"
      - name: "Last Name"
      - name: "Job Title"
      - name: "Employment Status"
      - name: "Sub Unit"
      - name: "Supervisor"
      - name: "Actions"
    rowCount: 50
    comment: "Employee list (table)"
actions:
  - do: Search the employee list
    kind: form
    fields:
      - { label: Employee Name, locator: '.oxd-input-group:has(label:text-is("Employee Name")) input', type: text }
      - { label: Employee Id, locator: '.oxd-input-group:has(label:text-is("Employee Id")) input', type: text }
      - { label: Employment Status, locator: '.oxd-input-group:has(label:text-is("Employment Status")) .oxd-select-text', type: dropdown }
      - { label: Include, locator: '.oxd-input-group:has(label:text-is("Include")) .oxd-select-text', type: dropdown }
      - { label: Supervisor Name, locator: '.oxd-input-group:has(label:text-is("Supervisor Name")) input', type: text }
      - { label: Job Title, locator: '.oxd-input-group:has(label:text-is("Job Title")) .oxd-select-text', type: dropdown }
      - { label: Sub Unit, locator: '.oxd-input-group:has(label:text-is("Sub Unit")) .oxd-select-text', type: dropdown }
    submit: 'getByRole("button", { name: "Search" })'
    effect: 'Filters the table in place, no navigation. The records counter updates (verified: "Employee Name" = "a" narrowed 192 to 162 records).'
  - do: Clear the search filters
    kind: click
    target: 'getByRole("button", { name: "Reset" })'
    effect: Restores the unfiltered list and clears every filter field.
  - do: Start adding an employee
    kind: click
    target: 'getByRole("button", { name: "Add" })'
    effect: Navigates to /web/index.php/pim/addEmployee.
  - do: Open an employee record for editing
    kind: rowAction
    target: '.oxd-table-card:has-text("<employee name>") i.bi-pencil-fill'
    effect: Navigates to /web/index.php/pim/viewPersonalDetails/empNumber/{id} for that row.
  - do: Delete an employee row
    kind: destructive
    notExercised: true
    target: '.oxd-table-card:has-text("<employee name>") i.bi-trash'
    effect: Opens a confirmation dialog and permanently deletes the employee. Never performed while mapping.
