    locator: { strategy: getByRole, args: ["button"], name: "Reset" }
    comment: "Reset (button)"
  - name: searchButton
    component: button
    locator: { strategy: getByRole, args: ["button"], name: "Search" }
    comment: "Search (button)"
  - name: recordsFoundHeading
    component: text
    locator: { strategy: css, args: [".orangehrm-horizontal-padding > .oxd-text:has-text(\"Records Found\")"] }
    comment: "Records Found (text)"
  - name: myClaimsTable
    component: table
    locator: { strategy: css, args: [".oxd-table"] }
    columns:
      - name: "Reference Id"
      - name: "Event Name"
      - name: "Description"
      - name: "Currency"
      - name: "Submitted Date"
      - name: "Status"
      - name: "Amount"
      - name: "Actions"
    rowCount: 5
    comment: "My Claims (table)"
actions:
  - do: Filter my claims
    kind: form
    fields:
      - { label: Reference Id, locator: '.oxd-input-group:has(label:text-is("Reference Id")) input', type: text }
      - { label: Event Name, locator: '.oxd-input-group:has(label:text-is("Event Name")) .oxd-select-text', type: dropdown }
      - { label: Status, locator: '.oxd-input-group:has(label:text-is("Status")) .oxd-select-text', type: dropdown }
      - { label: From Date, locator: '.oxd-input-group:has(label:text-is("From Date")) input', type: date }
      - { label: To Date, locator: '.oxd-input-group:has(label:text-is("To Date")) input', type: date }
    submit: 'getByRole("button", { name: "Search" })'
    effect: Filters the table in place and updates the "(n) Records Found" line. No navigation.
  - do: Start a new claim request
    kind: navigation
    target: '.orangehrm-header-container button:has-text("Submit Claim")'
    effect: Navigates to /claim/submitClaim.
  - do: View a claim's details
    kind: rowAction
    target: '.oxd-table-card:has-text("<reference id>") button:has-text("View Details")'
    effect: Opens the claim detail screen at /claim/viewAssignClaim/id/{id}.
  - do: Reset the filters
    kind: destructive
    notExercised: true
    target: 'getByRole("button", { name: "Reset" })'
    effect: Clears every filter field. Not exercised — "reset" is a denied click name.
