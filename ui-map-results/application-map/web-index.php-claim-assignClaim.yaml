actions:
  - do: Assign a claim to an employee
    kind: form
    fields:
      - { label: Employee Name, locator: '.oxd-input-group:has(label:text-is("Employee Name")) input', type: autocomplete, required: true }
      - { label: Event, locator: '.oxd-input-group:has(label:text-is("Event")) .oxd-select-text', type: dropdown, required: true }
      - { label: Currency, locator: '.oxd-input-group:has(label:text-is("Currency")) .oxd-select-text', type: dropdown, required: true }
      - { label: Remarks, locator: '.oxd-input-group:has(label:text-is("Remarks")) textarea', type: text }
    submit: 'getByRole("button", { name: "Create" })'
    effect: >-
      Assigns the claim and navigates to the claim detail screen (/claim/assignClaim/id/{id})
      where expenses can be added. Submitting empty stays on the page and shows "Required"
      under Employee Name, Event and Currency.
  - do: Pick an employee
    kind: autocomplete
    target: '.oxd-input-group:has(label:text-is("Employee Name")) input'
    effect: Typing at least one character opens a suggestion list of live employees; a name must be picked from it.
  - do: Cancel the assignment
    kind: navigation
    target: 'getByRole("button", { name: "Cancel" })'
    effect: Discards the form and returns to Employee Claims (/claim/viewAssignClaim).
