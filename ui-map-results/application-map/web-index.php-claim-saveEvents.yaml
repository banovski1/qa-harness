actions:
  - do: Add a claim event
    kind: form
    notExercised: true
    fields:
      - { label: Event Name, locator: '.oxd-input-group:has(label:text-is("Event Name")) input', type: text, required: true }
      - { label: Description, locator: '.oxd-input-group:has(label:text-is("Description")) textarea', type: text }
      - { label: Status, locator: '.oxd-switch-input', type: switch }
    submit: 'getByRole("button", { name: "Save" })'
    effect: >-
      Saves the event and returns to Events (/claim/viewEvents) with a success toast.
      Not exercised - "save" is a denied click name.
  - do: Cancel
    kind: navigation
    target: 'getByRole("button", { name: "Cancel" })'
    effect: Discards the form and returns to Events (/claim/viewEvents).
