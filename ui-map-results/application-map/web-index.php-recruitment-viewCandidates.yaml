  - name: recordsTable
    component: table
    locator: { strategy: template, args: ["tableByColumn"], name: "Vacancy" }
    columns:
      - name: "Vacancy"
      - name: "Candidate"
      - name: "Hiring Manager"
      - name: "Date of Application"
      - name: "Status"
      - name: "Actions"
    rowCount: 50
    comment: "Records (table)"
actions:
  - do: Search this screen
    kind: form
    fields:
      - { label: Job Title, locator: '.oxd-input-group:has(label:text-is("Job Title")) .oxd-select-text', type: dropdown }
      - { label: Vacancy, locator: '.oxd-input-group:has(label:text-is("Vacancy")) .oxd-select-text', type: dropdown }
      - { label: Hiring Manager, locator: '.oxd-input-group:has(label:text-is("Hiring Manager")) .oxd-select-text', type: dropdown }
      - { label: Status, locator: '.oxd-input-group:has(label:text-is("Status")) .oxd-select-text', type: dropdown }
      - { label: Candidate Name, locator: '.oxd-input-group:has(label:text-is("Candidate Name")) input', type: text }
      - { label: Keywords, locator: '.oxd-input-group:has(label:text-is("Keywords")) input', type: text }
      - { label: Date of Application, locator: '.oxd-input-group:has(label:text-is("Date of Application")) input', type: text }
      - { label: Method of Application, locator: '.oxd-input-group:has(label:text-is("Method of Application")) .oxd-select-text', type: dropdown }
    submit: 'getByRole("button", { name: "Search" })'
    effect: Filters the records table in place. No navigation.
  - do: Clear the search filters
    kind: click
    target: 'getByRole("button", { name: "Reset" })'
    effect: Restores the unfiltered list and clears every filter field.
  - do: Start adding a record
    kind: click
    target: 'button:text-is("Add")'
    effect: Opens the add form for this screen.
  - do: Open a record for editing
    kind: rowAction
    target: '.oxd-table-card:has-text("<record>") i.bi-pencil-fill'
    effect: Opens the edit form for that row.
  - do: Delete a record
    kind: destructive
    notExercised: true
    target: '.oxd-table-card:has-text("<record>") i.bi-trash'
    effect: Opens a confirmation dialog and permanently deletes the row. Never performed while mapping.
