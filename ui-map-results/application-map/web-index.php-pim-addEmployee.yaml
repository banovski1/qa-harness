    comment: "Middle Name (input)"
  - name: lastNameInput
    component: input
    locator: { strategy: getByPlaceholder, args: ["Last Name"] }
    comment: "Last Name (input)"
  - name: employeeIdInput
    component: input
    locator: { strategy: css, args: [".oxd-input-group:has(label:text-is(\"Employee Id\")) input"] }
    comment: "Employee Id (input)"
  - name: employeePhotoInput
    component: input
    locator: { strategy: css, args: ["input[type=file]"] }
    comment: "Employee Photo (input)"
  - name: createLoginDetailsSwitch
    component: switch
    locator: { strategy: css, args: [".oxd-switch-input"] }
    comment: "Create Login Details (switch)"
  - name: cancelButton
    component: button
    locator: { strategy: getByRole, args: ["button"], name: "Cancel" }
    comment: "Cancel (button)"
  - name: saveButton
    component: button
    locator: { strategy: getByRole, args: ["button"], name: "Save" }
    comment: "Save (button)"
actions:
  - do: "Create an employee"
    kind: form
    fields:
      - "First Name (required)"
      - "Middle Name"
      - "Last Name (required)"
      - "Employee Id (prefilled with the next id, editable)"
      - "Employee Photo (file)"
    submit: "saveButton"
    effect: "Saves and navigates to the new employee's Personal Details tab."
  - do: "Abandon the new employee"
    kind: navigation
    target: "cancelButton"
    leadsTo: "/web/index.php/pim/viewEmployeeList"
  - do: "Also create login credentials"
    kind: reveal
    target: "createLoginDetailsSwitch"
    effect: "Reveals Username, a Status radio pair (Enabled/Disabled), Password and Confirm Password. None of them exist until the switch is on, so they are not mapped as elements."
validations:
  - "Saving the form empty shows exactly two \"Required\" messages, under First Name and Last Name. Read them from `.oxd-input-field-error-message`."
