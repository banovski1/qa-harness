actions:
  - do: Reveal the login-details fields
    kind: click
    target: '.oxd-switch-input'
    effect: 'Toggling "Create Login Details" on reveals Username, Status (Enabled/Disabled radios), Password and Confirm Password. Toggling it off hides them again.'
  - do: Add an employee
    kind: form
    fields:
      - { label: First Name, locator: 'getByPlaceholder("First Name")', type: text }
      - { label: Middle Name, locator: 'getByPlaceholder("Middle Name")', type: text }
      - { label: Last Name, locator: 'getByPlaceholder("Last Name")', type: text }
      - { label: Employee Id, locator: '.oxd-input-group:has(label:text-is("Employee Id")) input', type: text }
      - { label: Username, locator: '.oxd-input-group:has(label:text-is("Username")) input', type: text, requires: 'Create Login Details switch on' }
      - { label: Password, locator: '.oxd-input-group:has(label:text-is("Password")) input', type: password, requires: 'Create Login Details switch on' }
      - { label: Confirm Password, locator: '.oxd-input-group:has(label:text-is("Confirm Password")) input', type: password, requires: 'Create Login Details switch on' }
    submit: 'getByRole("button", { name: "Save" })'
    notExercised: true
    effect: Creates the employee and navigates to /web/index.php/pim/viewPersonalDetails/empNumber/{id}. Not submitted while mapping — Save is a denied action.
  - do: Abandon the form
    kind: click
    target: 'getByRole("button", { name: "Cancel" })'
    effect: Returns to /web/index.php/pim/viewEmployeeList without creating anything.
  - do: Upload an employee photo
    kind: upload
    target: 'input[type="file"]'
    effect: Sets the profile picture preview. Accepts jpg/png up to 1MB.
