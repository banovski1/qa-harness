actions:
  - do: "Add a salary component"
    kind: reveal
    target: "addSalaryComponentsButton"
    effect: "Reveals an inline form on the same URL, including an \"Include Direct Deposit Details\" toggle that reveals further fields."
  - do: "Delete a salary component"
    kind: destructive
    target: "row → button i.bi-trash"
    notExercised: true
