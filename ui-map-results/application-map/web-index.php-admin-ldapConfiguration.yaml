actions:
  - do: Complete and submit this form
    kind: form
    fields:
      - { label: Host, locator: '.oxd-input-group:has(label:text-is("Host")) input', type: text }
      - { label: Port, locator: '.oxd-input-group:has(label:text-is("Port")) input', type: text }
      - { label: Encryption, locator: '.oxd-input-group:has(label:text-is("Encryption")) .oxd-select-text', type: dropdown }
      - { label: LDAP Implementation, locator: '.oxd-input-group:has(label:text-is("LDAP Implementation")) .oxd-select-text', type: dropdown }
      - { label: Distinguished Name, locator: '.oxd-input-group:has(label:text-is("Distinguished Name")) input', type: text }
      - { label: Password, locator: '.oxd-input-group:has(label:text-is("Password")) input', type: text }
      - { label: Base Distinguished Name, locator: '.oxd-input-group:has(label:text-is("Base Distinguished Name")) input', type: text }
      - { label: Search Scope, locator: '.oxd-input-group:has(label:text-is("Search Scope")) .oxd-select-text', type: dropdown }
      - { label: User Name Attribute, locator: '.oxd-input-group:has(label:text-is("User Name Attribute")) input', type: text }
      - { label: User Search Filter, locator: '.oxd-input-group:has(label:text-is("User Search Filter")) input', type: text }
      - { label: User Unique ID Attribute, locator: '.oxd-input-group:has(label:text-is("User Unique ID Attribute")) input', type: text }
      - { label: Sync Interval (in Hours), locator: '.oxd-input-group:has(label:text-is("Sync Interval (in Hours)")) input', type: text }
    submit: 'getByRole("button", { name: "Save" })'
    effect: Submits the form. Required fields left empty raise "Required" under each field.
