actions:
  - do: "Define a report"
    kind: form
    fields:
      - "Report Name (required)"
      - "Selection Criteria — pick a criterion, then a + button adds it as a row with its own value control"
      - "Include"
      - "Select Display Field Group"
      - "Select Display Field (options depend on the group)"
    submit: "saveButton"
    effect: "Saves the report and returns to the Reports list."
  - do: "Abandon the report"
    kind: navigation
    target: "cancelButton"
    leadsTo: "/web/index.php/pim/viewDefinedPredefinedReports"
note: "Reached only via Add on the Reports screen; the old crawler never found it."
