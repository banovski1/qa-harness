actions:
  - do: Complete and submit this form
    kind: form
    fields:
      - { label: User Role, locator: '.oxd-input-group:has(label:text-is("User Role")) .oxd-select-text', type: dropdown }
      - { label: Employee Name, locator: '.oxd-input-group:has(label:text-is("Employee Name")) input', type: text }
      - { label: Status, locator: '.oxd-input-group:has(label:text-is("Status")) .oxd-select-text', type: dropdown }
      - { label: Username, locator: '.oxd-input-group:has(label:text-is("Username")) input', type: text }
      - { label: Password, locator: '.oxd-input-group:has(label:text-is("Password")) input', type: text }
      - { label: Confirm Password, locator: '.oxd-input-group:has(label:text-is("Confirm Password")) input', type: text }
    submit: 'getByRole("button", { name: "Save" })'
    effect: Submits the form. Required fields left empty raise "Required" under each field.
