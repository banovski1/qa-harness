actions:
  - do: "Add a record to any qualifications section"
    kind: reveal
    target: "addWorkExperienceButton / addEducationButton / addSkillsButton / addLanguagesButton / addLicenseButton"
    effect: "Reveals that section's inline form on the same URL."
  - do: "Delete a qualification record"
    kind: destructive
    target: "row → button i.bi-trash"
    notExercised: true
note: "SIX Add buttons here (five sections plus Attachments), so an unscoped Add locator matches 6 elements. Every Add and table below is scoped by its section heading. The old crawler mapped none of these six tables."
