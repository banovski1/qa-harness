    locator: { strategy: css, args: [".orangehrm-horizontal-padding:has(h6:text-is(\"Attachments\")) button"] }
    comment: "Add Attachment (button)"
actions:
  - do: "Edit personal details"
    kind: form
    fields:
      - "First / Middle / Last Name"
      - "Employee Id"
      - "Other Id"
      - "Driver's License Number"
      - "License Expiry Date (free-text yyyy-dd-mm plus a calendar popup)"
      - "Nationality"
      - "Marital Status"
      - "Date of Birth"
      - "Gender (Male/Female radios)"
      - "Blood Type"
    submit: "savePersonalDetailsButton"
    effect: "Saves in place with a success toast. No navigation."
  - do: "Edit custom fields"
    kind: form
    fields:
      - "Test_Field (demo-seeded; a real instance will differ)"
    submit: "saveCustomFieldsButton"
    effect: "Saves the custom-field block independently of the main form. This screen has TWO Save buttons — both mapped locators are scoped by a field only their own form contains."
  - do: "Attach a file"
    kind: reveal
    target: "addAttachmentButton"
    effect: "Reveals an inline file-picker row with Cancel and Save."
