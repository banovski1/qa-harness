actions:
  - do: Edit personal details
    kind: form
    fields:
      - { label: First Name, locator: 'getByPlaceholder("First Name")', type: text }
      - { label: Middle Name, locator: 'getByPlaceholder("Middle Name")', type: text }
      - { label: Last Name, locator: 'getByPlaceholder("Last Name")', type: text }
      - { label: Employee Id, locator: '.oxd-input-group:has(label:text-is("Employee Id")) input', type: text }
      - { label: Other Id, locator: '.oxd-input-group:has(label:text-is("Other Id")) input', type: text }
      - { label: Driver's License Number, locator: '.oxd-input-group:has(label:text-is("Driver''s License Number")) input', type: text }
      - { label: License Expiry Date, locator: '.oxd-input-group:has(label:text-is("License Expiry Date")) input', type: date }
      - { label: Nationality, locator: '.oxd-input-group:has(label:text-is("Nationality")) .oxd-select-text', type: dropdown }
      - { label: Marital Status, locator: '.oxd-input-group:has(label:text-is("Marital Status")) .oxd-select-text', type: dropdown }
      - { label: Date of Birth, locator: '.oxd-input-group:has(label:text-is("Date of Birth")) input', type: date }
      - { label: Gender, locator: 'getByRole("radio", { name: "Male", exact: true })', type: radio }
      - { label: Blood Type, locator: '.oxd-input-group:has(label:text-is("Blood Type")) .oxd-select-text', type: dropdown }
    submit: '.orangehrm-horizontal-padding:has(h6:text-is("Personal Details")) button[type="submit"]'
    notExercised: true
    effect: Saves in place with a success toast, no navigation. Not submitted while mapping — Save is a denied action.
  - do: Switch to another employee tab
    kind: click
    target: 'getByRole("link", { name: "Contact Details" })'
    effect: Navigates to /web/index.php/pim/contactDetails/empNumber/{id}. The same tab strip covers Emergency Contacts, Dependents, Immigration, Job, Salary, Report-to, Qualifications and Memberships.
  - do: Attach a file to the employee record
    kind: click
    target: '.orangehrm-horizontal-padding:has(h6:text-is("Attachments")) button'
    effect: Reveals a file chooser plus a Comment field, with Cancel and Save buttons under the Attachments section.
