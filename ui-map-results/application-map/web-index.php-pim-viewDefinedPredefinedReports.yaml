  - name: selectAllCheckbox
    component: checkbox
    locator: { strategy: css, args: [".oxd-table-header .oxd-checkbox-input"] }
    comment: "Select all rows (checkbox)"
  - name: reportsTable
    component: table
    locator: { strategy: template, args: ["tableByColumn"], name: "Name" }
    columns:
      - name: ""
      - name: "Name"
      - name: "Actions"
    rowCount: 4
    comment: "Employee reports (table)"
actions:
  - do: Search reports by name
    kind: form
    fields:
      - { label: Report Name, locator: '.oxd-input-group:has(label:text-is("Report Name")) input', type: text }
    submit: 'getByRole("button", { name: "Search" })'
    effect: Filters the reports table in place, no navigation.
  - do: Clear the report search
    kind: click
    target: 'getByRole("button", { name: "Reset" })'
    effect: Restores all 4 predefined reports.
  - do: Define a new report
    kind: click
    target: 'getByRole("button", { name: "Add" })'
    effect: Navigates to the define-report screen (/web/index.php/pim/definePredefinedReport).
  - do: Edit a report
    kind: rowAction
    target: '.oxd-table-card:has-text("<report name>") i.bi-pencil-fill'
    effect: Opens that report for editing.
  - do: Delete a report
    kind: destructive
    notExercised: true
    target: '.oxd-table-card:has-text("<report name>") i.bi-trash'
    effect: Confirmation dialog, then permanent deletion. Never performed while mapping.
