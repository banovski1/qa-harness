  - name: reportTable
    component: table
    locator: { strategy: getByRole, args: ["table"] }
    columns:
      - name: "Name"
      - name: "Actions"
    rowCount: 0
    comment: "Report (table)"
actions:
  - do: "Search reports by name"
    kind: form
    fields:
      - "Report Name"
    submit: "searchButton"
    effect: "Filters the report table in place."
  - do: "Define a new report"
    kind: navigation
    target: "addButton"
    leadsTo: "/web/index.php/pim/definePredefinedReport"
  - do: "Delete a report"
    kind: destructive
    target: "row → button i.bi-trash"
    notExercised: true
