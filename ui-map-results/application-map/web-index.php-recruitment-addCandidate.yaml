actions:
  - do: Complete and submit this form
    kind: form
    fields:
      - { label: Vacancy, locator: '.oxd-input-group:has(label:text-is("Vacancy")) .oxd-select-text', type: dropdown }
      - { label: Email, locator: '.oxd-input-group:has(label:text-is("Email")) input', type: text }
      - { label: Contact Number, locator: '.oxd-input-group:has(label:text-is("Contact Number")) input', type: text }
      - { label: Resume, locator: '.oxd-input-group:has(label:text-is("Resume")) input', type: text }
      - { label: Keywords, locator: '.oxd-input-group:has(label:text-is("Keywords")) input', type: text }
      - { label: Date of Application, locator: '.oxd-input-group:has(label:text-is("Date of Application")) input', type: text }
      - { label: Notes, locator: '.oxd-input-group:has(label:text-is("Notes")) textarea', type: text }
      - { label: Consent to keep data, locator: '.oxd-input-group:has(label:text-is("Consent to keep data")) input', type: text }
    submit: 'getByRole("button", { name: "Save" })'
    effect: Submits the form. Required fields left empty raise "Required" under each field.
