    locator: { strategy: getByRole, args: ["link"], name: "Time" }
    comment: "Time (link)"
  - name: recruitmentMenuLink
    component: link
    locator: { strategy: getByRole, args: ["link"], name: "Recruitment" }
    comment: "Recruitment (link)"
  - name: myInfoMenuLink
    component: link
    locator: { strategy: getByRole, args: ["link"], name: "My Info" }
    comment: "My Info (link)"
  - name: performanceMenuLink
    component: link
    locator: { strategy: getByRole, args: ["link"], name: "Performance" }
    comment: "Performance (link)"
  - name: dashboardMenuLink
    component: link
    locator: { strategy: getByRole, args: ["link"], name: "Dashboard" }
    comment: "Dashboard (link)"
  - name: directoryMenuLink
    component: link
    locator: { strategy: getByRole, args: ["link"], name: "Directory" }
    comment: "Directory (link)"
  - name: maintenanceMenuLink
    component: link
    locator: { strategy: getByRole, args: ["link"], name: "Maintenance" }
    comment: "Maintenance (link)"
  - name: claimMenuLink
    component: link
    locator: { strategy: getByRole, args: ["link"], name: "Claim" }
    comment: "Claim (link)"
  - name: buzzMenuLink
    component: link
    locator: { strategy: getByRole, args: ["link"], name: "Buzz" }
    comment: "Buzz (link)"
  - name: currentUserHeading
    component: text
    locator: { strategy: css, args: [".oxd-userdropdown-name"] }
    comment: "Current user (text)"
  # --- this screen ---
  - name: employeeNameInput
    component: input
    locator: { strategy: template, args: ["labelledInput"], name: "Employee Name" }
    comment: "Employee Name (input)"
  - name: jobTitleDropdown
    component: dropdown
    locator: { strategy: template, args: ["labelledSelect"], name: "Job Title" }
    comment: "Job Title (dropdown)"
  - name: locationDropdown
    component: dropdown
    locator: { strategy: template, args: ["labelledSelect"], name: "Location" }
    comment: "Location (dropdown)"
  - name: resetButton
    component: button
    locator: { strategy: getByRole, args: ["button"], name: "Reset" }
    comment: "Reset (button)"
  - name: searchButton
    component: button
    locator: { strategy: getByRole, args: ["button"], name: "Search" }
    comment: "Search (button)"
actions:
  - do: Search this screen
    kind: form
    fields:
      - { label: Employee Name, locator: '.oxd-input-group:has(label:text-is("Employee Name")) input', type: text }
      - { label: Job Title, locator: '.oxd-input-group:has(label:text-is("Job Title")) .oxd-select-text', type: dropdown }
      - { label: Location, locator: '.oxd-input-group:has(label:text-is("Location")) .oxd-select-text', type: dropdown }
    submit: 'getByRole("button", { name: "Search" })'
    effect: Filters the records table in place. No navigation.
  - do: Clear the search filters
    kind: click
    target: 'getByRole("button", { name: "Reset" })'
    effect: Restores the unfiltered list and clears every filter field.
