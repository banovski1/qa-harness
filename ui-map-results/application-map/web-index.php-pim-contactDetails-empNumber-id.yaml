actions:
  - do: Edit contact details
    kind: form
    fields:
      - { label: Street 1, locator: '.oxd-input-group:has(label:text-is("Street 1")) input', type: text }
      - { label: Street 2, locator: '.oxd-input-group:has(label:text-is("Street 2")) input', type: text }
      - { label: City, locator: '.oxd-input-group:has(label:text-is("City")) input', type: text }
      - { label: State/Province, locator: '.oxd-input-group:has(label:text-is("State/Province")) input', type: text }
      - { label: Zip/Postal Code, locator: '.oxd-input-group:has(label:text-is("Zip/Postal Code")) input', type: text }
      - { label: Country, locator: '.oxd-input-group:has(label:text-is("Country")) .oxd-select-text', type: dropdown }
      - { label: Home, locator: '.oxd-input-group:has(label:text-is("Home")) input', type: text }
      - { label: Mobile, locator: '.oxd-input-group:has(label:text-is("Mobile")) input', type: text }
      - { label: Work, locator: '.oxd-input-group:has(label:text-is("Work")) input', type: text }
      - { label: Work Email, locator: '.oxd-input-group:has(label:text-is("Work Email")) input', type: text }
      - { label: Other Email, locator: '.oxd-input-group:has(label:text-is("Other Email")) input', type: text }
    submit: 'getByRole("button", { name: "Save" })'
    notExercised: true
    effect: Saves in place with a success toast, no navigation. Not submitted while mapping — Save is a denied action.
  - do: Attach a file to the employee record
    kind: click
    target: '.orangehrm-horizontal-padding:has(h6:text-is("Attachments")) button'
    effect: Reveals a file chooser plus a Comment field, with Cancel and Save buttons under the Attachments section.
  - do: Switch to another employee tab
    kind: click
    target: 'getByRole("link", { name: "Personal Details" })'
    effect: Navigates to /web/index.php/pim/viewPersonalDetails/empNumber/{id}. The same tab strip covers every other employee sub-screen.
