  - name: selectAllCheckbox
    component: checkbox
    locator: { strategy: css, args: [".oxd-table-header .oxd-checkbox-input"] }
    comment: "Select all (checkbox)"
  - name: eventsTable
    component: table
    locator: { strategy: css, args: [".oxd-table"] }
    columns:
      - name: "Event Name"
      - name: "Status"
      - name: "Actions"
    rowCount: 10
    comment: "Events (table)"
actions:
  - do: Filter claim events
    kind: form
    fields:
      - { label: Event Name, locator: '.oxd-input-group:has(label:text-is("Event Name")) input', type: text }
      - { label: Status, locator: '.oxd-input-group:has(label:text-is("Status")) .oxd-select-text', type: dropdown }
    submit: 'getByRole("button", { name: "Search" })'
    effect: Filters the table in place and updates the "(n) Records Found" line. No navigation.
  - do: Add a claim event
    kind: navigation
    target: '.orangehrm-header-container button:has-text("Add")'
    effect: Navigates to the Add Event form at /claim/saveEvents.
  - do: Delete a claim event
    kind: destructive
    notExercised: true
    target: '.oxd-table-card:has-text("<event name>") .bi-trash'
    effect: Opens a confirmation dialog and deletes the event. Not exercised - "delete" is a denied click name.
  - do: Reset the filters
    kind: destructive
    notExercised: true
    target: 'getByRole("button", { name: "Reset" })'
    effect: Clears every filter field. Not exercised - "reset" is a denied click name.
