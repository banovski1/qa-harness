    comment: "Add Attachment (button)"
actions:
  - do: "Edit job details"
    kind: form
    fields:
      - "Joined Date"
      - "Job Title"
      - "Job Category"
      - "Sub Unit"
      - "Location"
      - "Employment Status"
    submit: "saveButton"
    effect: "Saves in place. Job Title set here is what the Employee List Job Title filter reads."
  - do: "Terminate the employee"
    kind: destructive
    target: "terminateEmploymentButton"
    effect: "Opens a termination form (date, reason, note). Terminating moves the employee out of the default \"Current Employees Only\" list filter."
    notExercised: true
