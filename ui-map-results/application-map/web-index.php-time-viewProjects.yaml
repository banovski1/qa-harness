      - name: "Project Admins"
      - name: "Actions"
    rowCount: 11
    comment: "Records (table)"
actions:
  - do: Search this screen
    kind: form
    fields:
      - { label: Customer Name, locator: '.oxd-input-group:has(label:text-is("Customer Name")) input', type: text }
      - { label: Project, locator: '.oxd-input-group:has(label:text-is("Project")) input', type: text }
      - { label: Project Admin, locator: '.oxd-input-group:has(label:text-is("Project Admin")) input', type: text }
    submit: 'getByRole("button", { name: "Search" })'
    effect: Filters the records table in place. No navigation.
  - do: Clear the search filters
    kind: click
    target: 'getByRole("button", { name: "Reset" })'
    effect: Restores the unfiltered list and clears every filter field.
  - do: Start adding a record
    kind: click
    target: 'button:text-is("Add")'
    effect: Opens the add form for this screen.
  - do: Open a record for editing
    kind: rowAction
    target: '.oxd-table-card:has-text("<record>") i.bi-pencil-fill'
    effect: Opens the edit form for that row.
  - do: Delete a record
    kind: destructive
    notExercised: true
    target: '.oxd-table-card:has-text("<record>") i.bi-trash'
    effect: Opens a confirmation dialog and permanently deletes the row. Never performed while mapping.
