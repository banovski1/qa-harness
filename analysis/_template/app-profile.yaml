# Copy this to analysis/<your-app>/app-profile.yaml and fill it in.
#
# This is the ONLY file anyone writes by hand. Everything else under analysis/ is
# generated, and retargeting the whole pipeline at a new application is a new copy of
# this file — never a code change. If you find yourself editing a script to make your
# app work, that is a bug in the script.

# A human name. Shows up in reports; nothing depends on its spelling.
name: My App (staging)

# Where the running app lives. Every crawled URL is resolved against this, and a URL
# outside it is treated as leaving the application.
baseUrl: https://staging.example.com/

# Where the source is checked out, on this machine. The analysis skills read it to find
# declared routes, entities and API endpoints. `~` is expanded.
repoPath: ~/Projects/my-app

# A name for the browser session playwright-cli keeps between commands. Any short
# string; use a different one per app so two crawls cannot collide.
session: myapp

# ---------------------------------------------------------------------------
# How a test logs in. Set to `null` if the app needs no login for what you crawl.
#
# NEVER put a real password here. `env:NAME` reads the environment instead, and
# APP_USERNAME / APP_PASSWORD are the two names the rest of the pipeline expects.
# ---------------------------------------------------------------------------
auth:
  loginUrl: https://staging.example.com/login
  steps:
    - { action: fill, selector: "input[name='username']", value: "env:APP_USERNAME" }
    - { action: fill, selector: "input[name='password']", value: "env:APP_PASSWORD" }
    - { action: click, selector: "button[type='submit']" }
  # A selector that only exists once login succeeded. Pick something you can SEE —
  # a container with zero height proves nothing, and the crawl will report a successful
  # login it never made.
  readyWhen: ".app-header"

# Where the deep crawl starts. One per area of the app you care about. The crawl follows
# links from here; these are the doors, not the whole building.
seedRoutes:
  - "/dashboard"
  - "/customers"
  - "/customers/new"

# Anything matching these is never visited. `logout` is here for the obvious reason:
# one click ends the session and every screen after it is the login page.
exclude:
  - "logout"

budget:
  # Stop after this many screens. Raise it once you have seen a crawl finish.
  maxScreens: 40
  # How far to follow links from a seed. 2 is usually right; 3 explodes.
  maxDepth: 2

settings:
  # The attribute your app uses for test ids, if it has one. Leave as-is if not.
  testIdAttribute: data-testid
  # The element that wraps the page body, used to tell "still loading" from "empty".
  contentSelector: "main"
  batchSize: 6
  settleTimeout: 8000
  navTimeout: 30000
