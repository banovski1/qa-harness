# The only file in this analysis that names anything app-specific.
name: OrangeHRM (open-source demo)
baseUrl: https://opensource-demo.orangehrmlive.com/
repoPath: ~/Projects/orangehrm
session: ohrm

auth:
  loginUrl: https://opensource-demo.orangehrmlive.com/web/index.php/auth/login
  steps:
    - { action: fill, selector: "input[name='username']", value: "env:APP_USERNAME" }
    - { action: fill, selector: "input[name='password']", value: "env:APP_PASSWORD" }
    - { action: click, selector: "button[type='submit']" }
  readyWhen: ".oxd-topbar-header"

seedRoutes:
  - "/web/index.php/dashboard/index"
  - "/web/index.php/pim/viewEmployeeList"
  - "/web/index.php/pim/addEmployee"
  - "/web/index.php/admin/viewSystemUsers"
  - "/web/index.php/leave/viewLeaveList"
  - "/web/index.php/time/viewEmployeeTimesheet"
  - "/web/index.php/recruitment/viewCandidates"
  - "/web/index.php/performance/searchEvaluatePerformanceReview"
  - "/web/index.php/directory/viewDirectory"
  - "/web/index.php/claim/viewAssignClaim"
  - "/web/index.php/buzz/viewBuzz"

exclude:
  - "logout"
  - "/web/index.php/admin/viewSystemUsers\\?"

budget:
  maxScreens: 40
  maxDepth: 2

settings:
  testIdAttribute: data-testid
  contentSelector: ".oxd-layout-context"
  batchSize: 6
  settleTimeout: 8000
  navTimeout: 30000
