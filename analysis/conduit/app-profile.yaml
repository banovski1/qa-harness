name: Conduit (RealWorld, Angular)
baseUrl: https://demo.realworld.show/
repoPath: ~/Projects/angular-realworld-example-app
session: conduit

# The demo allows self-registration (POST /api/users), so a test user is made rather
# than shared. Left unauthenticated here: the public screens are the ones worth crawling,
# and a crawl that registers an account is no longer read-only.
auth: null

seedRoutes:
  - "/"
  - "/login"
  - "/register"
  - "/settings"
  - "/editor"
  - "/article/how-to-train-your-dragon"

exclude:
  - "logout"

budget:
  maxScreens: 15
  maxDepth: 2

settings:
  testIdAttribute: data-testid
  contentSelector: "app-root"
  batchSize: 4
  settleTimeout: 6000
  navTimeout: 20000
