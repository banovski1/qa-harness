# Odoo was NOT in the corpus the pipeline was built against. This profile and the four
# JSON reports beside it were produced by the same three skills, with no code change —
# that is the whole point of the exercise.
name: Odoo (source only)
baseUrl: http://localhost:8069/
repoPath: ~/Projects/odoo
session: odoo

# No instance is running, so nothing has been crawled. Every screen below is a declared
# route with a URL and no controls. Stand up an instance, fill in the auth block, and the
# crawl fills them in.
auth: null

seedRoutes:
  - "/odoo"
  - "/web/login"

exclude:
  - "logout"

budget:
  maxScreens: 40
  maxDepth: 2

settings:
  testIdAttribute: data-testid
  contentSelector: ".o_action_manager"
  batchSize: 4
  settleTimeout: 8000
  navTimeout: 30000
