resource: PIM/Update Password
source: openapi
operations:
  - operationId: update-password
    method: PUT
    path: /api/v2/pim/update-password
    requestBody:
      contentType: application/json
      schema:
        kind: object
        properties:
          - name: currentPassword
            type: string
            required: true
            nullable: false
          - name: newPassword
            type: string
            required: true
            nullable: false
    responses:
      - status: 200
        contentType: application/json
        schema:
          kind: object
          properties:
            - name: data
              type: unknown
              required: false
              nullable: false
